name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip project
        run: |
          if [ -f vrpass.zip ]; then unzip -o -q vrpass.zip; fi
          ls

      - name: Build APK
        working-directory: vrpass
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Save log on failure
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|Could not|^> " vrpass/build.log | head -40 | while read -r line; do echo "::error::$line"; done
          mkdir /tmp/logrepo
          cp vrpass/build.log /tmp/logrepo/build.log
          cd /tmp/logrepo
          git init -q
          git add build.log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:build-logs

      - name: Rename APK
        run: cp vrpass/app/build/outputs/apk/debug/app-debug.apk VR-Kozildirik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VR-APK
          path: VR-Kozildirik.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VR APK ${{ github.run_number }}
          files: VR-Kozildirik.apk
