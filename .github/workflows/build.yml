name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip project
        run: |
          if [ -f vrpass.zip ]; then unzip -o -q vrpass.zip; fi
          ls

      - name: Build APK
        working-directory: vrpass
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp vrpass/app/build/outputs/apk/debug/app-debug.apk VR-Kozildirik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VR-APK
          path: VR-Kozildirik.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VR APK ${{ github.run_number }}
          files: VR-Kozildirik.apk
